services:
  lilblue-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lilblue_dashboard
    restart: on-failure:3
    ports:
      - "0.0.0.0:8792:8792"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://kaydanskipc:11434}
      LILBLUE_TEST_MODEL: ${LILBLUE_TEST_MODEL:-qwen2.5:7b}
      # ${VAR:?msg} makes compose REFUSE to start if VAR is unset or empty.
      # Prevents the silent login-loop failure mode where `docker compose up -d`
      # without `doppler run` substitutes "" into the container env and breaks
      # every JWT validation. Run via ~/deploy.sh or wrap with
      # `doppler run --project birdmug-services --config prd -- docker compose ...`.
      BIRDMUG_JWT_SECRET: ${BIRDMUG_JWT_SECRET:?BIRDMUG_JWT_SECRET must be injected — use ~/deploy.sh or `doppler run --project birdmug-services --config prd -- ...`}
      BIRDMUG_AUTH_URL: ${BIRDMUG_AUTH_URL:-https://accounts.birdmug.com}
      BUG_FAIRY_API_KEY: ${BUG_FAIRY_API_KEY:?BUG_FAIRY_API_KEY must be injected — use ~/deploy.sh or `doppler run --project birdmug-services --config prd -- ...`}
    networks:
      - lilblue_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8792/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: lilblue_cloudflared
    restart: on-failure:3
    command: tunnel --no-autoupdate --config /etc/cloudflared/lilblue-config.yml run
    volumes:
      - /home/falkensteink/.cloudflared:/etc/cloudflared
    networks:
      - lilblue_net
    depends_on:
      lilblue-dashboard:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    # Cloudflared uses a distroless image (no sh/curl/wget), so a CMD-shell
    # healthcheck can't run. The cloudflared process self-monitors via its
    # own reconnect logic; restart: on-failure handles a crashed binary.

networks:
  lilblue_net:
    name: lilblue_net
